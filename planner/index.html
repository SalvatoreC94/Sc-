<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.json"><title>Salvatore Planner</title><style>:root{--bg:#0b0d12;--card:#141821;--muted:#9299a8;--text:#f5f7fb;--line:#252b36;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--purple:#af52de;--blue:#5e5ce6;--yellow:#ffd60a;--gray:#8e8e93}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom))}header{padding:22px 2px 14px;position:sticky;top:0;background:linear-gradient(var(--bg) 84%,transparent);z-index:5}h1{font-size:28px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.progress{height:8px;background:#1b2029;border-radius:99px;overflow:hidden;margin:8px 0 16px}.bar{height:100%;background:var(--green);width:0}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 12px;scrollbar-width:none}.tabs button{border:1px solid transparent;color:#fff;padding:9px 13px;border-radius:999px;white-space:nowrap;font-weight:650;opacity:.75}.tabs button.on{opacity:1;box-shadow:0 0 0 2px #fff5}.tabs button[data-k=all]{background:#3a3f49}.tabs button[data-k=uni]{background:var(--blue)}.tabs button[data-k=study]{background:var(--green);color:#071008}.tabs button[data-k=client]{background:var(--red)}.tabs button[data-k=tolc]{background:var(--yellow);color:#161205}.tabs button[data-k=org]{background:var(--gray);color:#111}.note{font-size:12px;color:#aeb4c0;padding:4px 2px}.day{margin:18px 0 10px;font-size:15px;font-weight:700}.date{color:var(--muted);font-weight:500}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:9px 0;display:flex;gap:12px;align-items:flex-start;box-shadow:0 5px 18px #0002}.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:0 0 10px}.content{flex:1}.time{font-size:13px;color:var(--muted);margin-bottom:4px}.title{font-size:16px;font-weight:650;line-height:1.25}.desc{font-size:13px;color:#aeb4c0;margin-top:5px;line-height:1.35}.done{opacity:.45}.done .title{text-decoration:line-through}.check{width:26px;height:26px;border-radius:50%;border:1px solid #555d6d;background:transparent;color:white;display:grid;place-items:center;flex:0 0 26px}.check.checked{background:var(--green);border-color:var(--green)}.conflict{border-color:var(--orange)!important}.conflict .desc{color:#ffb340}.empty{text-align:center;color:var(--muted);padding:60px 10px}footer{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#0b0d12ee;border-top:1px solid var(--line);backdrop-filter:blur(16px);display:flex;justify-content:center}.reset{background:#202631;color:#ddd;border:0;border-radius:12px;padding:10px 16px}</style></head><body><div class="app"><header><h1>Salvatore Planner</h1><div class="sub" id="today"></div><div class="stats"><div class="stat"><b id="uniH">0h</b><span>Università</span></div><div class="stat"><b id="workH">0h</b><span>Cliente</span></div><div class="stat"><b id="doneN">0</b><span>Completati</span></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="tabs" id="tabs"></div><div class="note">Colori: blu Università · verde Studio · rosso Cliente · giallo TOLC.</div></header><main id="list"></main></div><footer><button class="reset" onclick="resetChecks()">Reset progressi</button></footer><script>const C={uni:'#5e5ce6',study:'#34c759',client:'#ff3b30',tolc:'#ffd60a',org:'#8e8e93'},ev=[];function add(d,s,e,t,y,x=''){ev.push({date:d,start:s,end:e,title:t,type:y,desc:x,id:d+'|'+s+'|'+t})}function weekly(a,z,ds,s,e,t,y,x=''){let d=new Date(a+'T12:00:00'),q=new Date(z+'T12:00:00');for(;d<=q;d.setDate(d.getDate()+1))if(ds.includes(d.getDay()))add(d.toISOString().slice(0,10),s,e,t,y,x)}function subj(e){let t=e.title.toLowerCase();if(t.includes('programmazione'))return'#5e5ce6';if(t.includes('architettura'))return'#af52de';if(t.includes('analisi'))return'#ff9500';if(t.includes('cliente'))return'#ff3b30';if(t.includes('tolc'))return'#ffd60a';return C[e.type]}function uni(){weekly('2026-10-01','2026-11-30',[1],'08:30','10:30','Programmazione','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[1],'11:00','13:00','Programmazione','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[1],'14:00','16:00','Architettura degli Elaboratori','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[4],'08:30','10:30','Architettura degli Elaboratori','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[4],'11:00','13:00','Programmazione','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[4],'14:00','17:00','Analisi 1','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[5],'10:30','13:30','Analisi 1','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[5],'14:00','16:00','Architettura degli Elaboratori','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[5],'16:30','18:30','Programmazione','uni','Federico II · Aula A5')}function study(){weekly('2026-10-01','2026-11-30',[2],'13:30','15:00','Analisi 1 — esercizi','study','Teoria + esercizi.');weekly('2026-10-01','2026-11-30',[2],'15:15','16:15','Programmazione — esercizi','study','Ripasso + codice.');weekly('2026-10-01','2026-11-30',[3],'14:00','15:30','Programmazione — pratica','study','Esercizi e implementazione.');weekly('2026-10-01','2026-11-30',[3],'15:45','17:15','Analisi 1 — esercizi','study','Esercizi mirati.');weekly('2026-10-01','2026-11-30',[0],'18:00','18:30','Ripasso leggero','study','Sistemare appunti.');weekly('2026-10-01','2026-11-30',[4],'18:00','18:30','Ripasso leggero','study','Sistemare appunti.');weekly('2026-10-01','2026-11-30',[5],'09:00','09:45','Ripasso pre-lezione','study','Preparazione lezioni.')}function client(){weekly('2026-10-05','2026-11-14',[2],'09:00','12:00','Cliente — Deep Work','client','Sprint di sviluppo.');weekly('2026-10-05','2026-11-14',[2],'16:30','18:00','Cliente — Task / Bugfix','client','Task secondari, bugfix e test.');weekly('2026-10-05','2026-11-14',[3],'09:00','12:00','Cliente — Deep Work','client','Sprint di sviluppo.');weekly('2026-10-05','2026-11-14',[6],'09:00','12:00','Cliente — Deep Work','client','Sprint di sviluppo.');weekly('2026-10-05','2026-11-14',[6],'14:00','16:00','Cliente — Test / Rifinitura','client','Test e rifinitura.');[['2026-10-05','Settimana 1 — Analisi & architettura','Requisiti, struttura, setup.'],['2026-10-12','Settimana 2 — Core','Funzionalità principali.'],['2026-10-19','Settimana 3 — Funzionalità','Feature e integrazioni.'],['2026-10-26','Settimana 4 — Test & rifinitura','Bug fixing e UX.'],['2026-11-02','Settimana 5 — Release candidate','Feedback e correzioni.'],['2026-11-09','Settimana 6 — Consegna','Deploy, documentazione e consegna.']].forEach(x=>add(x[0],'16:30','17:00','Cliente — '+x[1],'client',x[2]))}function tolc(){weekly('2026-10-01','2026-10-20',[2],'18:30','19:30','TOLC — Matematica','tolc','Algebra, equazioni, funzioni.');weekly('2026-10-01','2026-10-20',[3],'18:00','19:00','TOLC — Logica','tolc','Sequenze, insiemi, ragionamento.');weekly('2026-10-01','2026-10-20',[6],'16:30','17:30','TOLC — Simulazione','tolc','Simulazione + correzione.');add('2026-10-21','09:00','12:00','TOLC-I @CASA','tolc','Prenotato per il 21 ottobre.')}function org(){weekly('2026-10-01','2026-11-30',[0],'18:30','19:00','Pianificazione cliente','org','Controllo avanzamento.');weekly('2026-10-01','2026-11-30',[6],'18:00','18:30','Pianificazione settimana','org','Priorità della settimana.')}uni();study();client();tolc();org();ev.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));const bad=(()=>{let r=new Set(),g={};ev.forEach(e=>(g[e.date]??=[]).push(e));Object.values(g).forEach(a=>{a.sort((x,y)=>x.start.localeCompare(y.start));for(let i=1;i<a.length;i++)if(a[i].start<a[i-1].end){r.add(a[i].id);r.add(a[i-1].id)}});return r})();const key='salvatorePlannerDone';let done=JSON.parse(localStorage.getItem(key)||'{}'),filter='all',names={all:'Tutto',uni:'Università',study:'Studio',client:'Cliente',tolc:'TOLC',org:'Organizzazione'};function dur(e){let[a,b]=e.start.split(':').map(Number),[c,d]=e.end.split(':').map(Number);return(c*60+d-a*60-b)/60}function tabs(){tabsEl.innerHTML=Object.entries(names).map(([k,v])=>`<button data-k="${k}" class="${filter==k?'on':''}" onclick="filter='${k}';render()">${v}</button>`).join('')}const tabsEl=document.getElementById('tabs');function render(){tabs();today.textContent=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});let a=filter==='all'?ev:ev.filter(x=>x.type===filter),g={};a.forEach(x=>(g[x.date]??=[]).push(x));list.innerHTML=Object.keys(g).map(d=>`<div class="day">${new Date(d+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})} <span class="date">${d}</span></div>`+g[d].map(e=>`<div class="card ${done[e.id]?'done ':''}${bad.has(e.id)?'conflict':''}"><div class="dot" style="background:${subj(e)}"></div><div class="content"><div class="time">${e.start}–${e.end}</div><div class="title">${e.title}</div><div class="desc">${e.desc}${bad.has(e.id)?' ⚠️ Sovrapposizione rilevata':''}</div></div><button class="check ${done[e.id]?'checked':''}" onclick="toggle('${encodeURIComponent(e.id)}')">${done[e.id]?'✓':''}</button></div>`).join('')).join('')||'<div class="empty">Nessun elemento.</div>';let n=Object.values(done).filter(Boolean).length;doneN.textContent=n;uniH.textContent=Math.round(ev.filter(e=>e.type==='uni').reduce((s,e)=>s+dur(e),0))+'h';workH.textContent=Math.round(ev.filter(e=>e.type==='client').reduce((s,e)=>s+dur(e),0)*10)/10+'h';bar.style.width=n/ev.length*100+'%'}function toggle(id){id=decodeURIComponent(id);done[id]=!done[id];localStorage.setItem(key,JSON.stringify(done));render()}function resetChecks(){if(confirm('Azzerare tutti i progressi?')){done={};localStorage.setItem(key,'{}');render()}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
