<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.json"><title>Salvatore Planner</title><style>:root{--bg:#0b0d12;--card:#14171d;--card2:#191d25;--muted:#8e95a3;--text:#f7f7f8;--line:#262b34;--green:#34c759;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;--blue:#5e5ce6;--yellow:#ffd60a;--gray:#63666d;--pink:#ff2d55}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 50% -15%,#202633 0,#0b0d12 36%);background-attachment:fixed;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 18px calc(30px + env(safe-area-inset-bottom))}header{padding:24px 20px 18px!important;margin:12px 0 10px!important;position:sticky;top:8px;background:rgba(20,23,29,.92)!important;border:1px solid rgba(255,255,255,.08);border-radius:26px;box-shadow:0 20px 50px rgba(0,0,0,.28);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:5}h1{font-size:30px;letter-spacing:-.8px;margin:0;font-weight:750}.sub{text-transform:capitalize;color:var(--muted);font-size:14px;margin-top:3px}.stats{display:flex;gap:0;margin:22px 0 16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.07)}.stat{background:none;border:0;padding:0;min-width:0;flex:1}.stat:not(:last-child){border-right:1px solid rgba(255,255,255,.07)}.stat:not(:first-child){padding-left:16px}.stat b{display:block;font-size:18px;letter-spacing:-.3px}.stat span{display:block;font-size:11px;color:var(--muted);margin:4px 0 0}.progress{height:5px;background:#20242c;border-radius:99px;overflow:hidden;margin:0 0 16px}.bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0;border-radius:99px;transition:width .35s ease}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 1px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tabs button{border:1px solid transparent;color:#fff;padding:8px 13px;border-radius:999px;white-space:nowrap;font-size:13px;font-weight:650;opacity:.72;transition:transform .18s,opacity .18s,box-shadow .18s}.tabs button:active{transform:scale(.96)}.tabs button.on{opacity:1;box-shadow:0 0 0 2px #fff4,0 5px 14px #0004}.tabs button[data-k=all]{background:#343942}.tabs button[data-k=uni]{background:#5e5ce6}.tabs button[data-k=study]{background:#34c759;color:#071008}.tabs button[data-k=client]{background:#ff453a}.tabs button[data-k=tolc]{background:#ffd60a;color:#161205}.tabs button[data-k=org]{background:#63666d}.tabs button[data-k=gym]{background:#ff2d55}.day{display:flex;align-items:baseline;gap:8px;margin:25px 2px 9px;font-size:15px;font-weight:700;letter-spacing:-.1px}.date{color:#626976;font-weight:500;font-size:11px}.card{position:relative;background:rgba(20,23,29,.88);border:1px solid var(--line);border-radius:16px;padding:13px 13px 13px 16px;margin:7px 0;display:flex;gap:11px;align-items:flex-start;box-shadow:0 8px 24px #00018;transition:transform .18s,background .18s,border-color .18s}.card:active{transform:scale(.985);background:var(--card2)}.dot{width:4px;height:38px;border-radius:5px;margin:0 1px 0 0;flex:0 0 4px}.content{flex:1;min-width:0}.time{font-size:12px;color:#8f96a4;font-variant-numeric:tabular-nums;margin-bottom:3px}.title{font-size:16px;font-weight:680;line-height:1.23;letter-spacing:-.15px}.desc{font-size:12.5px;color:#8f96a4;margin-top:5px;line-height:1.35}.done{opacity:.42}.done .title{text-decoration:line-through}.check{width:28px;height:28px;border-radius:50%;border:1px solid #454b57;background:#11141a;color:#fff;display:grid;place-items:center;flex:0 0 28px;font-size:15px;transition:all .2s}.check.checked{background:var(--green);border-color:var(--green);box-shadow:0 3px 10px #34c75933}.conflict{border-color:var(--orange)!important}.conflict .desc{color:#ffb340}.empty{text-align:center;color:var(--muted);padding:70px 10px}.note{display:none}@media(min-width:600px){.app{padding-left:24px;padding-right:24px}h1{font-size:32px}}@media(max-width:380px){header{padding:20px 16px 16px!important;margin:8px 0 8px!important;border-radius:22px}.stats{margin-top:18px;padding-top:14px}.stat:not(:first-child){padding-left:10px}.stat b{font-size:16px}.stat span{font-size:10px}.tabs button{padding:7px 10px}}</style></head><body><div class="app"><header><h1>Salvatore Planner</h1><div class="sub" id="today"></div><div class="stats"><div class="stat"><b id="uniH">0h</b><span>Università</span></div><div class="stat"><b id="workH">0h</b><span>Cliente</span></div><div class="stat"><b id="doneN">0</b><span>Completati</span></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="tabs" id="tabs"></div></header><main id="list"></main></div><script>const C={uni:'#5e5ce6',study:'#34c759',client:'#ff453a',tolc:'#ffd60a',org:'#63666d',gym:'#ff2d55'},ev=[];function add(d,s,e,t,y,x=''){ev.push({date:d,start:s,end:e,title:t,type:y,desc:x,id:d+'|'+s+'|'+t})}function weekly(a,z,ds,s,e,t,y,x=''){let d=new Date(a+'T12:00:00'),q=new Date(z+'T12:00:00');for(;d<=q;d.setDate(d.getDate()+1))if(ds.includes(d.getDay()))add(d.toISOString().slice(0,10),s,e,t,y,x)}function subj(e){let t=e.title.toLowerCase();if(t.includes('programmazione'))return'#5e5ce6';if(t.includes('architettura'))return'#bf5af2';if(t.includes('analisi'))return'#ff9f0a';if(t.includes('cliente'))return'#ff453a';if(t.includes('tolc'))return'#ffd60a';if(t.includes('palestra'))return'#ff2d55';return C[e.type]}function uni(){weekly('2026-10-01','2026-11-30',[1],'08:30','10:30','Programmazione','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[1],'11:00','13:00','Programmazione','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[1],'14:00','16:00','Architettura degli Elaboratori','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[4],'08:30','10:30','Architettura degli Elaboratori','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[4],'11:00','13:00','Programmazione','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[4],'14:00','17:00','Analisi 1','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[5],'10:30','13:30','Analisi 1','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[5],'14:00','16:00','Architettura degli Elaboratori','uni','Federico II · Aula A5');weekly('2026-10-01','2026-11-30',[5],'16:30','18:30','Programmazione','uni','Federico II · Aula A5')}function study(){weekly('2026-10-01','2026-11-30',[2],'13:30','15:00','Analisi 1 — esercizi','study','Teoria + esercizi.');weekly('2026-10-01','2026-11-30',[2],'15:15','16:15','Programmazione — esercizi','study','Ripasso + codice.');weekly('2026-10-01','2026-11-30',[3],'14:00','15:30','Programmazione — pratica','study','Esercizi e implementazione.');weekly('2026-10-01','2026-11-30',[3],'15:45','17:15','Analisi 1 — esercizi','study','Esercizi mirati.');weekly('2026-10-01','2026-11-30',[0],'18:00','18:30','Ripasso leggero','study','Sistemare appunti.');weekly('2026-10-01','2026-11-30',[4],'18:00','18:30','Ripasso leggero','study','Sistemare appunti.');weekly('2026-10-01','2026-11-30',[5],'09:00','09:45','Ripasso pre-lezione','study','Preparazione lezioni.')}function client(){weekly('2026-10-05','2026-11-14',[2],'09:00','12:00','Cliente — Deep Work','client','Sprint di sviluppo.');weekly('2026-10-05','2026-11-14',[2],'16:30','18:00','Cliente — Task / Bugfix','client','Task secondari, bugfix e test.');weekly('2026-10-05','2026-11-14',[3],'09:00','12:00','Cliente — Deep Work','client','Sprint di sviluppo.');weekly('2026-10-05','2026-11-14',[6],'09:00','12:00','Cliente — Deep Work','client','Sprint di sviluppo.');weekly('2026-10-05','2026-11-14',[6],'14:00','16:00','Cliente — Test / Rifinitura','client','Test e rifinitura.');[['2026-10-05','Settimana 1 — Analisi & architettura','Requisiti, struttura, setup.'],['2026-10-12','Settimana 2 — Core','Funzionalità principali.'],['2026-10-19','Settimana 3 — Funzionalità','Feature e integrazioni.'],['2026-10-26','Settimana 4 — Test & rifinitura','Bug fixing e UX.'],['2026-11-02','Settimana 5 — Release candidate','Feedback e correzioni.'],['2026-11-09','Settimana 6 — Consegna','Deploy, documentazione e consegna.']].forEach(x=>add(x[0],'16:30','17:00','Cliente — '+x[1],'client',x[2]))}function tolc(){weekly('2026-10-01','2026-10-20',[2],'18:30','19:30','TOLC — Matematica','tolc','Algebra, equazioni, funzioni.');weekly('2026-10-01','2026-10-20',[3],'18:00','19:00','TOLC — Logica','tolc','Sequenze, insiemi, ragionamento.');weekly('2026-10-01','2026-10-20',[6],'16:30','17:30','TOLC — Simulazione','tolc','Simulazione + correzione.');add('2026-10-21','09:00','12:00','TOLC-I @CASA','tolc','Prenotato per il 21 ottobre.')}function org(){weekly('2026-10-01','2026-11-30',[0],'18:30','19:00','Pianificazione cliente','org','Controllo avanzamento.');weekly('2026-10-01','2026-11-30',[6],'18:00','18:30','Pianificazione settimana','org','Priorità della settimana.')}function gym(){weekly('2026-10-01','2026-11-30',[1],'17:30','18:30','Palestra','gym','Allenamento · 1 ora.');weekly('2026-10-01','2026-11-30',[3],'17:30','18:30','Palestra','gym','Allenamento · 1 ora.');weekly('2026-10-01','2026-11-30',[5],'08:00','09:00','Palestra','gym','Allenamento · 1 ora.');weekly('2026-10-01','2026-11-30',[6],'16:00','17:00','Palestra','gym','Allenamento · 1 ora.')}uni();study();client();tolc();org();gym();ev.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));const bad=(()=>{let r=new Set(),g={};ev.forEach(e=>(g[e.date]??=[]).push(e));Object.values(g).forEach(a=>{a.sort((x,y)=>x.start.localeCompare(y.start));for(let i=1;i<a.length;i++)if(a[i].start<a[i-1].end){r.add(a[i].id);r.add(a[i-1].id)}});return r})();const key='salvatorePlannerDone';let done=JSON.parse(localStorage.getItem(key)||'{}'),filter='all',names={all:'Tutto',uni:'Università',study:'Studio',client:'Cliente',tolc:'TOLC',org:'Organizzazione',gym:'Palestra'};function dur(e){let[a,b]=e.start.split(':').map(Number),[c,d]=e.end.split(':').map(Number);return(c*60+d-a*60-b)/60}const tabsEl=document.getElementById('tabs');function renderTabs(){tabsEl.innerHTML=Object.entries(names).map(([k,v])=>`<button data-k="${k}" class="${filter==k?'on':''}" onclick="filter='${k}';render()">${v}</button>`).join('')}function render(){renderTabs();today.textContent=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});let a=filter==='all'?ev:ev.filter(x=>x.type===filter),g={};a.forEach(x=>(g[x.date]??=[]).push(x));list.innerHTML=Object.keys(g).map(d=>`<div class="day">${new Date(d+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})} <span class="date">${d}</span></div>`+g[d].map(e=>`<div class="card ${done[e.id]?'done ':''}${bad.has(e.id)?'conflict':''}"><div class="dot" style="background:${subj(e)}"></div><div class="content"><div class="time">${e.start}–${e.end}</div><div class="title">${e.title}</div><div class="desc">${e.desc}${bad.has(e.id)?' ⚠️ Sovrapposizione rilevata':''}</div></div><button class="check ${done[e.id]?'checked':''}" onclick="toggle('${encodeURIComponent(e.id)}')">${done[e.id]?'✓':''}</button></div>`).join('')).join('')||'<div class="empty">Nessun elemento.</div>';let n=Object.values(done).filter(Boolean).length;doneN.textContent=n;uniH.textContent=Math.round(ev.filter(e=>e.type==='uni').reduce((s,e)=>s+dur(e),0))+'h';workH.textContent=Math.round(ev.filter(e=>e.type==='client').reduce((s,e)=>s+dur(e),0)*10)/10+'h';bar.style.width=n/ev.length*100+'%'}function toggle(id){id=decodeURIComponent(id);done[id]=!done[id];localStorage.setItem(key,JSON.stringify(done));render()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
